<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bookstore Reviews</title>
</head>
<body>
  <h1>Reviews</h1>
  <div id="reviews"></div>
  <script>
    // FIXED (XSS): review text is inserted as text nodes (textContent), never parsed as HTML.
    async function load(bookId) {
      const res = await fetch('/reviews/' + bookId);
      const reviews = await res.json();
      const box = document.getElementById('reviews');
      box.replaceChildren(...reviews.map(t => {
        const p = document.createElement('p');
        p.textContent = t;
        return p;
      }));
    }
    load(1);
  </script>
</body>
</html>
